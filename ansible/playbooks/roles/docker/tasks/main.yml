---
- name: Instalar dependencias do Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-pip
    state: present
    update_cache: true

- name: Criar diretorio para a chave GPG do Docker
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Adicionar chave GPG oficial do Docker
  ansible.builtin.command:
    cmd: curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    creates: /etc/apt/keyrings/docker.asc

- name: Garantir permissao correta na chave GPG do Docker
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Adicionar repositorio do Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ (ansible_architecture == 'aarch64') | ternary('arm64','amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Instalar Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Instalar SDK Python do Docker (necessario para os modulos community.docker)
  ansible.builtin.pip:
    name: docker
    state: present
    extra_args: --break-system-packages

- name: Garantir que o Docker esta rodando e habilitado
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Adicionar usuario ubuntu ao grupo docker
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true
